[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sebi-clause-engine"
version = "0.2.0"
description = "Auditable clause amendment resolution and extractive QA research backend"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pdfplumber>=0.11,<1", "python-multipart>=0.0.18,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
sebi-engine = "sebi_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sebi_engine = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
